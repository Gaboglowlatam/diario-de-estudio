<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Diario de Estudio</h1>
      <p class="subtitle">Anota tus sesiones y mantén la racha.</p>
    </header>

    <section class="streak" aria-label="Racha actual">
      <span class="streak-fire" aria-hidden="true">🔥</span>
      <span class="streak-number" id="streak">0</span>
      <span class="streak-label" id="streak-label">días seguidos</span>
    </section>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Nueva sesión</h2>
      <form id="session-form" novalidate>
        <div class="form-grid">
          <div class="field field-date">
            <label for="date">Fecha</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="field field-topic">
            <label for="topic">Tema</label>
            <input type="text" id="topic" name="topic" placeholder="¿Qué estudiaste?" maxlength="100" required />
          </div>
          <div class="field field-minutes">
            <label for="minutes">Minutos</label>
            <input type="number" id="minutes" name="minutes" min="1" step="any" inputmode="numeric" placeholder="30" required />
          </div>
        </div>
        <p class="error" id="form-error" role="alert" hidden></p>
        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="sessions-title">
      <h2 id="sessions-title">Tus sesiones</h2>
      <ul class="sessions" id="sessions"></ul>
      <p class="empty" id="empty">Todavía no has registrado ninguna sesión.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
